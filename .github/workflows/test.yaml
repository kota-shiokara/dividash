name: Test

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Permission Gradle
        run: chmod 777 ./gradlew
      - name: test
        run: make test
